name: Lumina Dev Build

on:
  push:
    branches: [dev/1.21.6]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4
      - name: Get JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Setup Git Config
        run: |
          git config --global user.email "ci@leavesmc.org"
          git config --global user.name "LeavesMC CI"
      - name: Apply Patches
        run: |
          ./gradlew applyAllPatches
      - name: Create Leavesclip Jar
        run: |
          ./gradlew build
          ./gradlew assemble
          ls build/libs/
      - name: Move Jar
        run: |
          prop() {
            grep "${1}" gradle.properties | cut -d'=' -f2 | sed 's/\r//'
          }
          
          jarName="Lumina-1.21.6-R0.1-SNAPSHOT.jar"
          mv build/libs/Lumina-1.21.6-R0.1-SNAPSHOT.jar "$jarName"
          echo "jar=$jarName" >> "$GITHUB_ENV"
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.jar }}

          path: ${{ env.jar }}






